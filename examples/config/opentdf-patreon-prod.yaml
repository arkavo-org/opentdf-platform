# Production config draft: OpenTDF platform upstream behind platform.arkavo.net
# (arks proxies /kas.AccessService/*, /kas/v2/*, /.well-known/opentdf-configuration,
# and — with AUTHZ_PROXY=on — /authorization.v2.AuthorizationService/*).
#
# Identity: identity.arkavo.net (authnz-rs, CWT issuer). Verified live:
# discovery advertises access_token_format: application/cwt + cose_keys_uri,
# which this build's CWT verifier consumes (unprefixed names, post-#33).
#
# Fill in: services.entityresolution.evidence.seal_key (a secret, through
# OPENTDF_SERVICES_ENTITYRESOLUTION_EVIDENCE_SEAL_KEY), evidence.claims_chain_peps
# (the catalog node's client ID), bind/port, TLS/network specifics for your
# infra. No Patreon credentials: identity.arkavo.net materializes memberships
# and entitlements into the CWT, and the ERS makes no Patreon call.

mode: core,entityresolution,-policy,-kas

logger:
  level: info
  type: json

server:
  port: 8080
  auth:
    enabled: true
    enforceDPoP: false
    issuer: https://identity.arkavo.net
    # Requires authnz-rs#39 (OIDC_PLATFORM_AUDIENCE=https://platform.arkavo.net
    # on identity) so app tokens AND the catalog node's service token both
    # carry this audience.
    audience: https://platform.arkavo.net
    policy:
      # authnz CWTs carry the PEP client identity in arkavo_account_id
      # ("client:<id>" for client_credentials) — a plain string claim.
      client_id_claim: arkavo_account_id
      # authnz CWTs carry roles in arkavo_roles (client_credentials mints
      # ["service-account"]). NOTE the key is groups_claim, not claim.
      groups_claim: arkavo_roles
      # Map authnz role names onto platform roles. service-account →
      # role:standard grants exactly the GetDecision* + Rewrap routes.
      map:
        standard: service-account

services:
  authorization:
    # Declarative policy snapshot — no Postgres. Namespace patreon.arkavo.com:
    # classification/content-type/entitlement + status subject mappings, plus
    # the dynamic campaign / campaign-tier definitions the ERS fills with
    # direct entitlements.
    policy_file: /etc/opentdf/policy.patreon.yaml
    # Required for the dynamic campaign-tier values (synthetic) the Patreon
    # ERS emits as direct entitlements.
    allow_direct_entitlements: true
  entityresolution:
    # Composite entity resolver: the presence of `sources` selects it (setting
    # `mode` as well is a startup error). Each source owns the attribute
    # definitions it is listed for; constraints only remove grants.
    deadline: 300ms
    evidence:
      issuers:
        - issuer: https://identity.arkavo.net
          cose_keys_url: https://identity.arkavo.net/.well-known/cose-keys
          audience: https://platform.arkavo.net
      # HMAC key sealing arkavo_evidence between the two ERS calls: standard
      # base64 with padding, at least 32 bytes decoded. The deployment supplies
      # it as a secret (this file is committed); startup fails while it is empty.
      seal_key: ""
      # Client IDs of the PEPs whose unsealed claims chains are accepted.
      # The catalog node's client ID, confirmed on 2026-10-25 from the production
      # launch template ([catalog.authz] client_id) and by authnz-rs.
      # Empty accepts no PEP chain, so the second call finds no claims.
      # Each entry is the exact value the platform derives through
      # server.auth.policy.client_id_claim (arkavo_account_id above), which
      # for the catalog node's client_credentials service token is
      # "client:<id>". Never an account UUID: every token of that account,
      # its agents' tokens included, carries it and would be admitted.
      claims_chain_peps: ["client:catalog-node"]

    sources:
      - id: patreon
        type: patreon-token
        issuer: https://identity.arkavo.net
        # Grants come from the arkavo_entitlements claim; arkavo_patreon feeds
        # only the .patreon properties.
        grants:
          - https://patreon.arkavo.com/attr/campaign
          - https://patreon.arkavo.com/attr/campaign-tier
        properties_key: patreon                     # keeps .patreon.* subject mappings
        pep_assertable: true
        # Non-Patreon traffic resolves as a free follower so it still flows
        # through subject mappings instead of erroring NotFound.
        infer_unknown_as_free: true

      - id: identity-core
        type: token-claims
        issuer: https://identity.arkavo.net
        claim: arkavo_entitlements
        grants:
          - https://patreon.arkavo.com/attr/arkavo-creator   # the publish entitlement
        actions: [publish]
        pep_assertable: true

    # constraints: agent_status is unset, so every agent subject is withheld.
    # Device rules (what a device may do for a person) are not set here: they
    # are the policy file's device_rules section.
    #
    # Do not enable publishing_status until arks serves
    # GET /moderation/v1/suspensions/{subject} with moderation on (arkavo-rs#93,
    # PR #124). It fails closed, so enabling it early refuses publishing for every
    # creator. The identity client must be registered with
    # aud = [opentdf-platform, https://platform.arkavo.net]. Known limit: sealed
    # arkavo_evidence is not re-checked, so a token's sealed grant lasts until
    # that evidence expires.
    # constraints:
    #   publishing_status:
    #     url: https://platform.arkavo.net
    #     dial_address: 127.0.0.1:443
    #     identity_url: https://identity.arkavo.net
    #     client_id: opentdf-platform
    #     client_secret: ""
    #     # Optional; each at most 5s. A suspension takes effect within about 5s.
    #     timeout: 3s     # per call to arks
    #     cache_ttl: 5s   # how long a not-suspended answer is reused
