# Patreon-backed policy snapshot.
#
# Defines the attribute axes for data tagging plus the Patreon-sourced
# campaign and campaign-tier attributes, which the composite entity
# resolver's patreon source grants from the token's arkavo_entitlements
# (service/entityresolution/patreon/v2). There are no subject mappings.
#
# Reference this file from opentdf.yaml as:
#
#   services:
#     authorization:
#       policy_file: ./examples/config/policy.patreon.yaml
#
# Run the platform without the policy CRUD service to skip Postgres entirely:
#
#   mode: core,-policy

namespaces:
  - name: arkavo.net
  - name: patreon.arkavo.com

key_access_servers:
  - id: kas-arkavo
    uri: https://kas.arkavo.com

attributes:
  # ---- Data-tagging attributes (assigned to TDFs at encryption time) ----
  - namespace: patreon.arkavo.com
    name: classification
    rule: hierarchy
    grants:
      - id: kas-arkavo
    values:
      - value: public
      - value: member
      - value: paid
      - value: vip

  - namespace: patreon.arkavo.com
    name: content-type
    rule: anyOf
    values:
      - value: text
      - value: image
      - value: video
      - value: audio

  - namespace: patreon.arkavo.com
    name: entitlement
    rule: allOf
    values:
      - value: exclusive-content
      - value: early-access
      - value: behind-the-scenes
      - value: live-stream
      - value: discord

  # ---- Patreon-sourced subject attributes ----
  # campaign and campaign-tier carry the per-creator gating. Both have
  # DYNAMIC values: the composite ERS's patreon source grants them as direct
  # entitlements (campaign/value/<id>, campaign-tier/value/<id>_<slug>) from
  # the token's arkavo_entitlements claim, and the PDP resolves them as
  # synthetic values (allow_direct_entitlements), so onboarding a creator
  # needs no policy change — only these definitions.
  # No global tier ladder: tiers are campaign-qualified in the creator's own
  # vocabulary, so a tier at one creator never satisfies another's gate.
  - namespace: patreon.arkavo.com
    name: campaign
    rule: anyOf
    grants:
      - id: kas-arkavo
    values: []

  - namespace: patreon.arkavo.com
    name: status
    rule: anyOf
    values:
      - value: active
      - value: declined
      - value: former

  # campaign-tier gates content on a tier WITHIN a campaign, in the
  # creator's own tier vocabulary: value format <campaign_id>_<tier_slug>
  # (e.g. 12345678_gold-tier). Values are DYNAMIC — granted as direct
  # entitlements by the composite ERS's patreon source and resolved as
  # synthetic values (allow_direct_entitlements), so onboarding a creator
  # needs no policy change; only this definition must exist. Content tagged
  # "this tier and up" carries the explicit value list (anyOf) — the
  # Creator app expands its own ladder at protect time.
  - namespace: patreon.arkavo.com
    name: campaign-tier
    rule: anyOf
    values: []

  # arkavo-creator gates publishing. Its one value is granted directly by the
  # composite ERS's identity-core source from the token's arkavo_entitlements
  # claim (action publish), so it has no subject mapping. The ERS withholds it
  # while arks reports the creator suspended (constraints.publishing_status).
  - namespace: patreon.arkavo.com
    name: arkavo-creator
    rule: anyOf
    values:
      - value: publish

  # creator lets a creator with no Patreon campaign open their own recordings
  # and catalog metadata (opentdf-platform#64). Values are DYNAMIC, one per
  # account: creator/value/<arkavo account id>, granted (action read) by the
  # composite ERS's creator source from the token's arkavo_entitlements claim,
  # which identity.arkavo.net mints. Definitions combine as AND, so Creator
  # tags a TDF with either the Patreon campaign attributes or this one, never
  # both. Viewers reach a creator's content through Patreon only.
  - namespace: arkavo.net
    name: creator
    rule: anyOf
    grants:
      - id: kas-arkavo
    values: []

# No subject mappings. Campaign and campaign-tier are granted as direct
# entitlements from arkavo_entitlements by the composite ERS's patreon source.
# The status and entitlement mappings, which read the .patreon properties, were
# dropped (opentdf-platform#69): nothing grants those two definitions now, so
# content tagged with them is denied.
subject_mappings: []
