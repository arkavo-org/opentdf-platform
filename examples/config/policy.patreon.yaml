# Patreon-backed policy snapshot.
#
# Defines two attribute axes for data tagging plus three Patreon-sourced
# subject attributes (tier, campaign, status) with subject mappings keyed off
# the claim shape produced by the Patreon entity resolution provider
# (service/entityresolution/patreon).
#
# Reference this file from opentdf.yaml as:
#
#   services:
#     authorization:
#       policy_file: ./examples/config/policy.patreon.yaml
#
# Run the platform without the policy CRUD service to skip Postgres entirely:
#
#   mode: core,-policy

namespaces:
  - name: patreon.arkavo.com

key_access_servers:
  - id: kas-arkavo
    uri: https://kas.arkavo.com

attributes:
  # ---- Data-tagging attributes (assigned to TDFs at encryption time) ----
  - namespace: patreon.arkavo.com
    name: classification
    rule: hierarchy
    grants:
      - id: kas-arkavo
    values:
      - value: public
      - value: member
      - value: paid
      - value: vip

  - namespace: patreon.arkavo.com
    name: content-type
    rule: anyOf
    values:
      - value: text
      - value: image
      - value: video
      - value: audio

  - namespace: patreon.arkavo.com
    name: entitlement
    rule: allOf
    values:
      - value: exclusive-content
      - value: early-access
      - value: behind-the-scenes
      - value: live-stream
      - value: discord

  # ---- Patreon-sourced subject attributes ----
  # campaign and campaign-tier carry the per-creator gating. Both have
  # DYNAMIC values: the Patreon ERS claims-passthrough emits them as direct
  # entitlements (campaign/value/<id>, campaign-tier/value/<id>_<slug>) and
  # the PDP resolves them as synthetic values (allow_direct_entitlements),
  # so onboarding a creator needs no policy change — only these definitions.
  # No global tier ladder: tiers are campaign-qualified in the creator's own
  # vocabulary, so a tier at one creator never satisfies another's gate.
  - namespace: patreon.arkavo.com
    name: campaign
    rule: anyOf
    grants:
      - id: kas-arkavo
    values: []

  - namespace: patreon.arkavo.com
    name: status
    rule: anyOf
    values:
      - value: active
      - value: declined
      - value: former

  # campaign-tier gates content on a tier WITHIN a campaign, in the
  # creator's own tier vocabulary: value format <campaign_id>_<tier_slug>
  # (e.g. 12345678_gold-tier). Values are DYNAMIC — emitted as direct
  # entitlements by the Patreon ERS claims-passthrough path and resolved as
  # synthetic values (allow_direct_entitlements), so onboarding a creator
  # needs no policy change; only this definition must exist. Content tagged
  # "this tier and up" carries the explicit value list (anyOf) — the
  # Creator app expands its own ladder at protect time.
  - namespace: patreon.arkavo.com
    name: campaign-tier
    rule: anyOf
    values: []

subject_mappings:
  # Campaign and campaign-tier gating is NOT done with subject mappings —
  # the Patreon ERS emits those as direct entitlements per active
  # membership, so there are no per-creator entries here. The mappings below
  # are creator-agnostic vocabularies (status, benefit-derived entitlements).

  # status: surface the Patreon membership lifecycle so policies can revoke
  # access when payments fail.
  - attribute_value_fqn: https://patreon.arkavo.com/attr/status/value/active
    inline_condition_set:
      subject_sets:
        - condition_groups:
            - boolean_operator: AND
              conditions:
                - subject_external_selector_value: .patreon.status
                  operator: IN
                  subject_external_values:
                    - active
    actions:
      - name: read
        standard: TRANSMIT

  - attribute_value_fqn: https://patreon.arkavo.com/attr/status/value/declined
    inline_condition_set:
      subject_sets:
        - condition_groups:
            - boolean_operator: AND
              conditions:
                - subject_external_selector_value: .patreon.status
                  operator: IN
                  subject_external_values:
                    - declined
    actions:
      - name: read
        standard: TRANSMIT

  - attribute_value_fqn: https://patreon.arkavo.com/attr/status/value/former
    inline_condition_set:
      subject_sets:
        - condition_groups:
            - boolean_operator: AND
              conditions:
                - subject_external_selector_value: .patreon.status
                  operator: IN
                  subject_external_values:
                    - former

    actions:
      - name: read
        standard: TRANSMIT

  # Entitlement mappings derived from Patreon benefits. The Patreon ERS
  # surfaces benefit slugs in patreon.benefits[]; the allOf rule means data
  # tagged with several entitlements requires the subject to hold all of them.
  - attribute_value_fqn: https://patreon.arkavo.com/attr/entitlement/value/exclusive-content
    inline_condition_set:
      subject_sets:
        - condition_groups:
            - boolean_operator: AND
              conditions:
                - subject_external_selector_value: .patreon.benefits[]
                  operator: IN
                  subject_external_values:
                    - exclusive-content
    actions:
      - name: read
        standard: TRANSMIT

  - attribute_value_fqn: https://patreon.arkavo.com/attr/entitlement/value/early-access
    inline_condition_set:
      subject_sets:
        - condition_groups:
            - boolean_operator: AND
              conditions:
                - subject_external_selector_value: .patreon.benefits[]
                  operator: IN
                  subject_external_values:
                    - early-access
    actions:
      - name: read
        standard: TRANSMIT

  - attribute_value_fqn: https://patreon.arkavo.com/attr/entitlement/value/behind-the-scenes
    inline_condition_set:
      subject_sets:
        - condition_groups:
            - boolean_operator: AND
              conditions:
                - subject_external_selector_value: .patreon.benefits[]
                  operator: IN
                  subject_external_values:
                    - behind-the-scenes
    actions:
      - name: read
        standard: TRANSMIT

  - attribute_value_fqn: https://patreon.arkavo.com/attr/entitlement/value/live-stream
    inline_condition_set:
      subject_sets:
        - condition_groups:
            - boolean_operator: AND
              conditions:
                - subject_external_selector_value: .patreon.benefits[]
                  operator: IN
                  subject_external_values:
                    - live-stream
    actions:
      - name: read
        standard: TRANSMIT

  - attribute_value_fqn: https://patreon.arkavo.com/attr/entitlement/value/discord
    inline_condition_set:
      subject_sets:
        - condition_groups:
            - boolean_operator: AND
              conditions:
                - subject_external_selector_value: .patreon.benefits[]
                  operator: IN
                  subject_external_values:
                    - discord
    actions:
      - name: read
        standard: TRANSMIT
