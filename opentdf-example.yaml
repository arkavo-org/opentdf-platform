logger:
  level: debug
  type: text
  output: stdout
# DB and Server configurations are defaulted for local development
db:
  host: opentdfdb
#   port: 5432
#   user: postgres
#   password: changeme
#   sslmode: prefer
#   connect_timeout_seconds: 15
#   pool:
#     max_connection_count: 4
#     min_connection_count: 0
#     min_idle_connections_count: 0
#     max_connection_lifetime_seconds: 3600
#     max_connection_idle_seconds: 1800
#     health_check_period_seconds: 60
# mode: all
services:
  kas:
    eccertid: e1
    rsacertid: r1
  entityresolution:
    url: http://keycloak:8888/auth
    clientid: "tdf-entity-resolution"
    clientsecret: "secret"
    realm: "opentdf"
    legacykeycloak: true
    inferid:
      from:
        email: true
        username: true
  # policy is enabled by default in mode 'all'
  # policy:
  #   enabled: true
  #   list_request_limit_default: 1000
  #   list_request_limit_max: 2500
  # authorization:
  #   entitlement_policy_cache:
  #     enabled: false
  #     refresh_interval: 30s
  #   rar:
  #     enabled: false
  #     issuer: opentdf-authorization
  #     token_ttl: 1h
  #     # CWT subject-token support (RFC 8392). Opt-in. When enabled the RAR
  #     # endpoint accepts subject_token_type=urn:ietf:params:oauth:token-type:cwt
  #     # and verifies COSE_Sign1 / ES256 signatures against the COSE Key Set
  #     # published by the IdP that mints the CWTs (e.g. authnz-rs at
  #     # /.well-known/cose-keys).
  #     cwt_verifier:
  #       enabled: false
  #       cose_keys_url: https://authnz.example/.well-known/cose-keys
  #       issuer: https://authnz.example
  #       audience: opentdf-platform
  #       algorithm: ES256
  #       cache_ttl: 10m
server:
  auth:
    enabled: true
    enforceDPoP: false
    audience: "http://localhost:8080"
    issuer: http://keycloak:8888/auth/realms/opentdf
    policy:
      ## Dot notation is used to access nested claims (i.e. realm_access.roles)
      # Claim that represents the user (i.e. email)
      username_claim: # preferred_username
      # That claim to access groups (i.e. realm_access.roles)
      groups_claim: # realm_access.roles
      # Claim the represents the idP client ID
      client_id_claim: # azp
      # Optional external role provider (name is resolved via StartOptions)
      # roles_provider:
      #   name: external
      #   config: {} # provider-specific (any object)
      ## Bind platform roles to idP groups (role: group)
      map:
        # admin: opentdf-admin
        # standard: opentdf-standard
      ## Extends the built-in grant table
      extension: #|
      #  grants:
      #    - subjects: ["role:standard"]
      #      resources: ["new.service.*"]
      #      actions: ["read"]
      ## Replaces the built-in grant table entirely
      grants: #|
      #  grants:
      #    - subjects: ["role:admin"]
      #      resources: ["*"]
      #      actions: ["*"]
      #  bindings:
      #    - subject: opentdf-admin
      #      role: admin
      ## Govern platform API operations with the policy graph itself: each
      ## endpoint is a registered resource value, decided by the same PDP
      ## that governs data. Endpoints with no registered resource fall back
      ## to the grant table above.
      endpoint_policy:
        enabled: false
        # namespace: platform.example.com
        # resource_name: endpoint
      ## Cryptographic root of trust for the operations that would otherwise
      ## depend on the policy they change. Disabled unless an authority is named.
      bootstrap:
        enabled: false
        # issuers:
        #   - https://root.example.com
        # capabilities_claim: capabilities
        # require_confirmation: true
      ## AuthZEN Authorization API (POST /access/v1/evaluation)
      authzen:
        enabled: true
  cors:
    # "*" to allow any origin or a specific domain like "https://yourdomain.com"
    allowedorigins:
      - "*"
    # List of methods. Examples: "GET,POST,PUT"
    allowedmethods:
      - GET
      - POST
      - PATCH
      - PUT
      - DELETE
      - OPTIONS
    # List of headers that are allowed in a request
    allowedheaders:
      - Accept
      - Accept-Encoding
      - Authorization
      - Connect-Protocol-Version
      - Content-Length
      - Content-Type
      - Dpop
      - X-CSRF-Token
      - X-Requested-With
      - X-Rewrap-Additional-Context
    # List of response headers that browsers are allowed to access
    exposedheaders:
      - Link
    # Sets whether credentials are included in the CORS request
    allowcredentials: true
    # Sets the maximum age (in seconds) of a specific CORS preflight request
    maxage: 3600
  grpc:
    reflectionEnabled: true # Default is false
  cryptoProvider:
    type: standard
    standard:
      keys:
        - kid: r1
          alg: rsa:2048
          private: /keys/kas-private.pem
          cert: /keys/kas-cert.pem
        - kid: e1
          alg: ec:secp256r1
          private: /keys/kas-ec-private.pem
          cert: /keys/kas-ec-cert.pem
  port: 8080
